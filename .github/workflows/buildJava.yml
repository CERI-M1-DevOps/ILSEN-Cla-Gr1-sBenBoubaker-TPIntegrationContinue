name : "Java CI with Maven - Test and package"

on:
  pull_request:
    branches: [ "main" ]

jobs:
build: 
 runs-on: ubuntu-latest
 steps:
 - name : "Checkout code"
   uses : actions/checkout@v4
   
 - name : "java 21"
   uses : actions/setup-java@v4
   with:
     distribution: 'Corretto'
     java-version: '21'

-name : test avec maven
  run : mvn -B package




