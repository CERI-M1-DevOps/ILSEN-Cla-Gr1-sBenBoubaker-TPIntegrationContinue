name : "Java CI with Maven - Test and package

on:
  pull_request:
    branches: [ "main" ]

jobs:
 runs-on: ubuntu-latest # OS où s'exécute le job
 steps:
 - uses : actions/checkout@v4
 - uses : actions/setup-java@v4
   with:
     distribution: 'corretto'
     java-version: '17'
  
run : mvn -B package 





